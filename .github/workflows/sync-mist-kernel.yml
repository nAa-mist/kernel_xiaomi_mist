name: Migrate Mist Kernel Fast & Clean

on:
  workflow_dispatch:

jobs:
    migrate:
      runs-on: ubuntu-latest
      steps:
        - name: Install GitHub CLI
          run: sudo apt-get update && sudo apt-get install -y gh

        - name: Auto-Create Repo and Push
          env:
            GH_PAT: ${{ secrets.GH_PAT }}
            GH_TOKEN: ${{ secrets.GH_PAT }}
          run: |
            TARGET_ORG="nAa-mist"
            REPO_NAME="kernel_xiaomi_mist"
            FULL_TARGET="$TARGET_ORG/$REPO_NAME"

            # 1. Create repo if missing
            if ! gh repo view "$FULL_TARGET" >/dev/null 2>&1; then
              gh repo create "$FULL_TARGET" --public --description "Xiaomi Mist Kernel source" || true
            fi

            # 2. Clone with a very shallow depth (depth 1) to completely avoid 1-million commit bloat
            git clone --single-branch --branch mist-w-oss --depth 1 https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git "$REPO_NAME"
            cd "$REPO_NAME"

            # 3. Reinitialize as a fresh single-commit repository under your name
            rm -rf .git
            git init
            git checkout -b main

            # Configure your identity
            git config user.name "hashyofficial"
            git config user.email "hashyofficial@gmail.com"

            # Add all files as a clean initial commit (or keep recent state)
            git add .
            git commit -m "Initial commit: mist-w-oss kernel snapshot"

            # 4. Configure buffers for large push
            git config http.postBuffer 524288000
            git config http.maxRequestBuffer 100M

            # 5. Push to target
            git remote add origin "https://x-access-token:${GH_PAT}@github.com/$FULL_TARGET.git"
            git push -u origin main --force
